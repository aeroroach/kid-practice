   optionally adjust set names/counts here).
   ========================================================= */

  title: "English Quiz 📖",

    { id: "grammar",  name: "Like & Likes", emoji: "🧩", count: 5 },

/* =========================================================
   Session builder: random sampling + shuffling
   ---------------------------------------------------------
   Every run (fresh load or Try Again) reshuffles the pool
   of each set, takes `count` questions, and shuffles the
   answer options. Retries therefore always differ.
   ========================================================= */

function shuffle(arr){
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}

function buildSession(){
  return QUIZ_SETUP.sets.map(function (set) {
    const pool = QUIZ_DATA.filter(function (q) { return q.set === set.id; });
    const picked = shuffle(pool.slice()).slice(0, set.count);
    const questions = picked.map(function (q) {
      const order = shuffle(q.options.map(function (_, i) { return i; }));
      return Object.assign({}, q, {
        options: order.map(function (i) { return q.options[i]; }),
        correct: order.indexOf(q.correct)
      });
    });
    return { set: set, questions: questions };
  });
}

let qi = 0;      // current question index within set
let scores = []; // correct count per set

function totalQuestions(){
  return session.reduce(function (n, s) { return n + s.questions.length; }, 0);
}
function globalIndex(){
  let n = 0;
  for (let i = 0; i < si; i++) n += session[i].questions.length;
  return n + qi;
}
function totalScore(){
  return scores.reduce(function (a, b) { return a + b; }, 0);
}

/* ---------- Listen (SpeechSynthesis, native & offline) ---------- */
let cachedVoice = null;
function enVoice(){
  if (cachedVoice || !("speechSynthesis" in window)) return cachedVoice;
  const vs = speechSynthesis.getVoices();
  cachedVoice = vs.find(function (v) { return /^en[-_](US|GB)/i.test(v.lang); })
    || vs.find(function (v) { return v.lang.toLowerCase().startsWith("en"); })
    || null;
  return cachedVoice;
}
function speak(text){
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  u.rate = 0.85;
  const v = enVoice();
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}
if ("speechSynthesis" in window) {
  try { speechSynthesis.addEventListener("voiceschanged", enVoice); } catch (e) {}
  enVoice();
}

document.getElementById("listenBtn").addEventListener("click", function () {
  if (currentListen) speak(currentListen);
});

/* ---------- Question rendering ---------- */
function shapeHTML(s){
  if (s.t === "emoji") {
    const size = 44 * (s.s || 2);
    return '<div class="shape emoji" style="font-size:' + size + 'px">' + s.e + "</div>";
  }
  return "";
}

function render(){
  answered = false;
  const s = session[si];
  const q = s.questions[qi];
  const total = totalQuestions();
  subtitleEl.textContent = s.set.emoji + " " + s.set.name;
  qnumEl.textContent = "Question " + (globalIndex() + 1) + " of " + total;
  progressFill.style.width = (globalIndex() / total * 100) + "%";
  qtext.textContent = q.q;
  currentListen = q.listen || "";
  listenWrap.style.display = q.listen ? "flex" : "none";

  promptEl.innerHTML = "";
  if (q.prompt) {
    q.prompt.forEach(function (s2) {
      promptEl.insertAdjacentHTML("beforeend",
        '<div class="prompt-item">' + shapeHTML(s2) +
        (s2.label ? '<div class="prompt-label">' + s2.label + "</div>" : "") + "</div>");
    });
  }

  optionsEl.className = "options" + (q.options.some(function (o) { return typeof o !== "string"; }) ? " grid" : "");
  optionsEl.innerHTML = "";
  q.options.forEach(function (o, i) {
    const btn = document.createElement("button");
    btn.className = "option";
    if (typeof o === "string") {
      btn.textContent = o;
    } else {
      btn.insertAdjacentHTML("beforeend", '<span class="opt-shape">' + shapeHTML(o.shape) + "</span>");
      btn.insertAdjacentHTML("beforeend", '<span class="opt-label">' + o.label + "</span>");
    }
    btn.addEventListener("click", function () { handle(i); });
    optionsEl.appendChild(btn);
  });

  feedbackEl.className = "feedback";
  feedbackEl.classList.remove("show");
  nextBtn.classList.remove("show");
}

let answered = false;

function handle(i){
  if (answered) return;
  answered = true;
  const q = session[si].questions[qi];
  const right = i === q.correct;
  if (right) scores[si]++;

  optionsEl.classList.add("locked");
  Array.prototype.forEach.call(optionsEl.children, function (b, bi) {
    if (bi === q.correct) b.classList.add("correct");
    else if (bi === i) b.classList.add("wrong");
    else b.classList.add("dim");
  });

  feedbackEl.classList.add("show", right ? "good" : "bad");
  feedbackHead.textContent = right ? "Great job! 🎉" : "Good try! 💪";
  feedbackNote.textContent = q.note;

  const last = globalIndex() === totalQuestions() - 1;
  nextBtn.textContent = last ? "See my score 🏆" : "Next ➡️";
  nextBtn.classList.add("show");
  progressFill.style.width = ((globalIndex() + 1) / totalQuestions() * 100) + "%";
}

/* ---------- Set intro ---------- */
function showSetIntro(i){
  quizCard.style.display = "none";
  scoreScreen.classList.remove("show");
  setIntro.classList.add("show");
  const s = session[i];
  document.getElementById("setIntroEmoji").textContent = s.set.emoji;
  document.getElementById("setIntroName").textContent = s.set.name;
  document.getElementById("setIntroSub").textContent =
    (i === 0 ? "Let's practice " : "Next up: ") + s.set.name.toLowerCase() +
    " — " + s.questions.length + " questions!";
}

document.getElementById("startSetBtn").addEventListener("click", function () {
  setIntro.classList.remove("show");
  quizCard.style.display = "flex";
  render();
});

/* ---------- Score screen ---------- */
function showScore(){
  quizCard.style.display = "none";
  setIntro.classList.remove("show");
  scoreScreen.classList.add("show");
  const total = totalQuestions();
  const got = totalScore();
  const pct = got / total;
  document.getElementById("stars").textContent = pct >= 0.9 ? "⭐⭐⭐" : pct >= 0.6 ? "⭐⭐" : "⭐";
  document.getElementById("scoreTitle").textContent = pct === 1 ? "Perfect! 🎉" : pct >= 0.6 ? "Good work! 👍" : "Keep practicing! 🌱";
  document.getElementById("scoreText").textContent = got + " out of " + total + " correct";

  const res = document.getElementById("setResults");
  res.innerHTML = "";
  session.forEach(function (s, i) {
    const sc = scores[i];
    const row = document.createElement("div");
    row.className = "set-result";
    row.innerHTML =
      '<span>' + s.set.emoji + " " + s.set.name + "</span>" +
      '<span class="stars">' + "⭐".repeat(sc) + "☆".repeat(s.questions.length - sc) + "</span>" +
      "<span>" + sc + "/" + s.questions.length + "</span>";
    res.appendChild(row);
  });

  document.getElementById("scoreSub").textContent =
    pct === 1
      ? "You know all about foods and friends!"
      : "Ask a grown-up to read the notes, then try again!";
}

/* ---------- Navigation & restart ---------- */
nextBtn.addEventListener("click", function () {
  qi++;
  if (qi >= session[si].questions.length) {
    qi = 0;
    si++;
    if (si >= session.length) showScore();
    else showSetIntro(si);
  } else {
    render();
  }
});

function restart(){
  session = buildSession();
  si = 0;
  qi = 0;
  scores = session.map(function () { return 0; });
  scoreScreen.classList.remove("show");
  quizCard.style.display = "none";
  setIntro.classList.remove("show");
  showSetIntro(0);
}

document.getElementById("tryAgain").addEventListener("click", restart);

/* ---------- Boot ---------- */
document.title = QUIZ_SETUP.title;
restart();
</script>
</body>
</html>
